name: Build Web App (React + Vite + Node)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and build web app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build React/Vite client and Node server
        run: npm run build

      - name: Save web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: performa-web-dist
          path: dist/
          if-no-files-found: error
